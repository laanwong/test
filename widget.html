<!DOCTYPE html>
<html>
<head>
<title>ACC File Viewer - KAPITOL (PKCE)</title>
<meta charset="UTF-8">
<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  max-width: 1000px;
  margin: 0 auto;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}
.container {
  background: white;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
h2 { color: #0696d7; margin-bottom: 10px; }
.section {
  background: #f8f9fa;
  padding: 20px;
  margin: 20px 0;
  border-radius: 6px;
  border-left: 4px solid #0696d7;
}
.section h3 {
  color: #0696d7;
  margin-bottom: 15px;
  font-size: 18px;
}
button {
  background: #0696d7;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  margin-right: 10px;
  margin-bottom: 10px;
}
button:hover { background: #0575b3; }
button:disabled { background: #ccc; cursor: not-allowed; }
input {
  padding: 10px;
  width: 100%;
  max-width: 450px;
  border: 2px solid #ddd;
  border-radius: 4px;
  font-size: 14px;
  margin-bottom: 10px;
}
#log {
  background: #1e1e1e;
  color: #4ade80;
  padding: 15px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 12px;
  max-height: 300px;
  overflow-y: auto;
  margin-top: 15px;
}
.file-item {
  background: white;
  border: 1px solid #ddd;
  padding: 12px;
  margin: 8px 0;
  border-radius: 4px;
  transition: all 0.2s;
}
.file-item:hover {
  border-color: #0696d7;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.highlight {
  background: #fff8e1;
  border-color: #ffc107;
  border-width: 2px;
}
code {
  background: #f4f4f4;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 11px;
}
.alert {
  background: #e7f3ff;
  border-left: 4px solid #2196F3;
  padding: 12px;
  margin: 15px 0;
  border-radius: 4px;
  font-size: 13px;
}
</style>
<script>

// CONFIG - UPDATE THIS WITH YOUR NEW CLIENT ID
const CLIENT_ID = "Fdg2SIQGh1AQIodSBAG2Kqa0fDDNusI0htPyzU7MUJQIE6Md";
const REDIRECT_URI = "https://laanwong.github.io/test/widget.html";
const SCOPES = "data:read data:write data:create bucket:read bucket:create account:read account:write";

// Global variables
let TOKEN = null;
let HUBS = [];
let PROJECTS = [];
let SELECTED_HUB = null;

// Logging
function log(message, type = 'info') {
  const logDiv = document.getElementById('log');
  const timestamp = new Date().toLocaleTimeString();
  const colors = {
    success: '#4ade80',
    error: '#f87171',
    info: '#60a5fa',
    warning: '#fbbf24'
  };
  const entry = document.createElement('div');
  entry.style.color = colors[type] || colors.info;
  entry.textContent = `[${timestamp}] ${message}`;
  logDiv.insertBefore(entry, logDiv.firstChild);
  console.log(`[${type.toUpperCase()}]`, message);
}

// PKCE Helper Functions - FIXED
function generateCodeVerifier() {
  const charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const length = 128;
  let verifier = '';
  const randomValues = new Uint8Array(length);
  crypto.getRandomValues(randomValues);
  for (let i = 0; i < length; i++) {
    verifier += charset[randomValues[i] % charset.length];
  }
  return verifier;
}

async function sha256(plain) {
  const encoder = new TextEncoder();
  const data = encoder.encode(plain);
  const hash = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hash));
  const hashBinary = hashArray.map(b => String.fromCharCode(b)).join('');
  const base64 = btoa(hashBinary);
  return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// Start OAuth with PKCE
async function startLogin() {
  log('🔐 Generating PKCE challenge...', 'info');
  
  const verifier = generateCodeVerifier();
  const challenge = await sha256(verifier);
  sessionStorage.setItem("pkce_verifier", verifier);
  
  log('🔐 Redirecting to Autodesk login...', 'info');

  const authUrl = `https://developer.api.autodesk.com/authentication/v2/authorize?` +
    `response_type=code&` +
    `client_id=${encodeURIComponent(CLIENT_ID)}&` +
    `redirect_uri=${encodeURIComponent(REDIRECT_URI)}&` +
    `scope=${encodeURIComponent(SCOPES)}&` +
    `code_challenge=${challenge}&` +
    `code_challenge_method=S256`;
  
  window.location.href = authUrl;
}

// Exchange code for token with PKCE
async function getToken(code) {
  log('🔄 Exchanging code for access token...', 'info');
  
  const verifier = sessionStorage.getItem("pkce_verifier");

  try {
    const response = await fetch("https://developer.api.autodesk.com/authentication/v2/token", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: CLIENT_ID,
        code: code,
        code_verifier: verifier,
        redirect_uri: REDIRECT_URI
      })
    });

    const data = await response.json();
    
    if (data.access_token) {
      TOKEN = data.access_token;
      sessionStorage.setItem("acc_token", TOKEN);
      log("✅ Authentication successful!", 'success');
      
      document.getElementById('btnHubs').disabled = false;
      document.getElementById('btnProjects').disabled = false;
      document.getElementById('btnSearch').disabled = false;
      
      setTimeout(() => loadHubs(), 500);
    } else {
      log("❌ Token exchange failed: " + data.error_description, 'error');
    }

    window.history.replaceState({}, document.title, window.location.pathname);
  } catch (error) {
    log("❌ Error: " + error.message, 'error');
  }
}

// Load Hubs
async function loadHubs() {
  if (!TOKEN) {
    TOKEN = sessionStorage.getItem("acc_token");
    if (!TOKEN) {
      log('❌ No access token. Please login first.', 'error');
      return;
    }
  }
  
  log('🔄 Loading hubs...', 'info');
  
  try {
    const response = await fetch('https://developer.api.autodesk.com/project/v1/hubs', {
      headers: { 'Authorization': `Bearer ${TOKEN}` }
    });
    
    const data = await response.json();
    
    if (data.data && data.data.length > 0) {
      HUBS = data.data;
      log(`✅ Found ${HUBS.length} hub(s)`, 'success');
      displayHubs();
    } else {
      log('❌ No hubs found', 'error');
      console.log('Response:', data);
    }
  } catch (error) {
    log('❌ Error loading hubs: ' + error.message, 'error');
  }
}

function displayHubs() {
  const resultsDiv = document.getElementById('results');
  let html = '<div class="section"><h3>📊 Available Hubs</h3>';
  
  HUBS.forEach(hub => {
    const name = hub.attributes.name;
    const isKapitol = name.toLowerCase().includes('kapitol');
    html += `<div class="file-item ${isKapitol ? 'highlight' : ''}">
      <strong>${name} ${isKapitol ? '⭐' : ''}</strong><br>
      <small style="color: #666;">Hub ID: <code>${hub.id.substring(0, 20)}...</code></small><br>
      <button onclick="selectHub('${hub.id}')" style="margin-top: 8px; padding: 8px 16px; font-size: 12px;">Select Hub</button>
    </div>`;
  });
  
  html += '</div>';
  resultsDiv.innerHTML = html;
}

function selectHub(hubId) {
  SELECTED_HUB = hubId;
  const hub = HUBS.find(h => h.id === hubId);
  log(`✅ Selected hub: ${hub.attributes.name}`, 'success');
  loadProjects();
}

async function loadProjects() {
  if (!SELECTED_HUB) {
    log('❌ Please select a hub first', 'warning');
    return;
  }
  
  log('🔄 Loading projects...', 'info');
  
  try {
    const url = `https://developer.api.autodesk.com/project/v1/hubs/${SELECTED_HUB}/projects`;
    const response = await fetch(url, {
      headers: { 'Authorization': `Bearer ${TOKEN}` }
    });
    
    const data = await response.json();
    
    if (data.data && data.data.length > 0) {
      PROJECTS = data.data;
      log(`✅ Found ${PROJECTS.length} project(s)`, 'success');
      displayProjects();
    } else {
      log('❌ No projects found', 'error');
    }
  } catch (error) {
    log('❌ Error loading projects: ' + error.message, 'error');
  }
}

function displayProjects() {
  const resultsDiv = document.getElementById('results');
  let html = '<div class="section"><h3>📁 Available Projects</h3>';
  
  PROJECTS.forEach(project => {
    const name = project.attributes.name;
    const isHanwha = name.toLowerCase().includes('hanwha');
    html += `<div class="file-item ${isHanwha ? 'highlight' : ''}">
      <strong>${name} ${isHanwha ? '⭐' : ''}</strong><br>
      <small style="color: #666;">Project ID: <code>${project.id.substring(0, 20)}...</code></small><br>
      <button onclick="getFiles('${project.id}')" style="margin-top: 8px; padding: 8px 16px; font-size: 12px;">📂 Get Files</button>
    </div>`;
  });
  
  html += '</div>';
  resultsDiv.innerHTML = html;
}

async function searchFiles() {
  const searchName = document.getElementById("pname").value.trim().toLowerCase();
  
  if (!searchName) {
    alert('Please enter a project name');
    return;
  }
  
  if (PROJECTS.length === 0) {
    log('❌ No projects loaded. Please load hubs and projects first.', 'warning');
    return;
  }
  
  log(`🔍 Searching for: "${searchName}"`, 'info');
  
  const matches = PROJECTS.filter(p => 
    p.attributes.name.toLowerCase().includes(searchName)
  );
  
  if (matches.length === 0) {
    log(`❌ No projects found matching "${searchName}"`, 'error');
    return;
  }
  
  log(`✅ Found ${matches.length} matching project(s)`, 'success');
  getFiles(matches[0].id);
}

async function getFiles(projectId) {
  if (!TOKEN || !SELECTED_HUB) {
    log('❌ Missing token or hub', 'error');
    return;
  }
  
  const project = PROJECTS.find(p => p.id === projectId);
  log(`📂 Getting files from: ${project.attributes.name}`, 'info');
  
  try {
    const foldersUrl = `https://developer.api.autodesk.com/project/v1/hubs/${SELECTED_HUB}/projects/${projectId}/topFolders`;
    const foldersResp = await fetch(foldersUrl, {
      headers: { 'Authorization': `Bearer ${TOKEN}` }
    });
    
    const folders = await foldersResp.json();
    
    if (!folders.data || folders.data.length === 0) {
      log('❌ No folders found', 'error');
      return;
    }
    
    const folderId = folders.data[0].id;
    log(`📁 Reading folder: ${folders.data[0].attributes.name}`, 'info');
    
    const filesUrl = `https://developer.api.autodesk.com/data/v1/projects/${projectId}/folders/${folderId}/contents`;
    const filesResp = await fetch(filesUrl, {
      headers: { 'Authorization': `Bearer ${TOKEN}` }
    });
    
    const files = await filesResp.json();
    
    if (files.data && files.data.length > 0) {
      log(`✅ Found ${files.data.length} items`, 'success');
      displayFiles(files.data.slice(0, 10), project.attributes.name);
    } else {
      log('❌ No files found', 'warning');
    }
  } catch (error) {
    log('❌ Error: ' + error.message, 'error');
  }
}

function displayFiles(files, projectName) {
  const resultsDiv = document.getElementById('results');
  let html = `<div class="section"><h3>📄 First 10 Items in ${projectName}</h3>`;
  
  files.forEach((item, i) => {
    const icon = item.type === 'folders' ? '📁' : '📄';
    const name = item.attributes.displayName;
    const ext = item.attributes.extension || 'N/A';
    const date = item.attributes.createTime ? 
      new Date(item.attributes.createTime).toLocaleDateString() : 'N/A';
    
    html += `<div class="file-item">
      <strong>${i + 1}. ${icon} ${name}</strong><br>
      <small style="color: #666;">Type: ${item.type} | Extension: ${ext} | Created: ${date}</small>
    </div>`;
  });
  
  html += '</div>';
  resultsDiv.innerHTML = html;
}

window.onload = () => {
  log('✨ Widget loaded - PKCE mode', 'info');
  
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  
  if (code) {
    getToken(code);
  } else {
    TOKEN = sessionStorage.getItem("acc_token");
    if (TOKEN) {
      log('✅ Found existing session', 'success');
      document.getElementById('btnHubs').disabled = false;
      document.getElementById('btnProjects').disabled = false;
      document.getElementById('btnSearch').disabled = false;
    }
  }
};

</script>
</head>

<body>
<div class="container">
  <h2>🏗️ ACC File Viewer - KAPITOL (PKCE)</h2>
  <p style="color: #666; margin-bottom: 20px;">Autodesk Construction Cloud - No Client Secret Required</p>
  
  <div class="alert">
    <strong>📌 Using PKCE Authentication</strong><br>
    More secure - no Client Secret exposed on GitHub!
  </div>

  <div class="section">
    <h3>Step 1: Login</h3>
    <button onclick="startLogin()">🔐 Login with Autodesk</button>
  </div>

  <div class="section">
    <h3>Step 2: Browse Data</h3>
    <button onclick="loadHubs()" id="btnHubs" disabled>📊 Load Hubs</button>
    <button onclick="loadProjects()" id="btnProjects" disabled>📁 Load Projects</button>
  </div>

  <div class="section">
    <h3>Step 3: Search Files</h3>
    <input id="pname" placeholder="Enter project name (e.g., HANWHA)" style="max-width: 300px;" />
    <button onclick="searchFiles()" id="btnSearch" disabled>🔍 Search Files</button>
  </div>

  <div id="results"></div>

  <div class="section">
    <h3>📋 Activity Log</h3>
    <div id="log"></div>
  </div>
</div>
</body>
</html>
